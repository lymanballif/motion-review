<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Study</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfb; overflow: hidden; }
  /* Fixed-size artboard, scaled to fit above the review bar */
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; overflow: hidden; background: #fbfbfb;
    transform-origin: 0 0; font-family: system-ui, sans-serif; }
  .box { position: absolute; left: 0; top: 0; width: 240px; height: 240px; border-radius: 56px; background: #1d1d1f; will-change: transform, opacity; }
</style>
</head>
<body>
<div id="stage"><div id="box" class="box"></div></div>

<script src="vendor/motion-review/anim-player.js"></script>
<script src="vendor/motion-review/review-bar.js"></script>
<script>
(() => {
  // ---------- Timeline: named phases, one place to retime ----------
  const DUR = 4;
  const T = { enter: [0.3, 1.1], move: [1.4, 2.3], exit: [3.0, 3.6] };

  // ---------- Easing ----------
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t, dx = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-7 || !d) break; t -= e / d; }
      return sy(Math.min(1, Math.max(0, t))); };
  }
  const out = bezier(0.23, 1, 0.32, 1), inOut = bezier(0.6, 0, 0.1, 1);
  const seg = (t, a, b, ease) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const mix = (a, b, p) => a + (b - a) * p;

  // ---------- render(t): a pure function of time ----------
  const box = document.getElementById('box');
  function render(t) {
    const e = seg(t, ...T.enter, out), m = seg(t, ...T.move, inOut), x = seg(t, ...T.exit, inOut);
    box.style.opacity = e * (1 - x);
    box.style.transform = `translate3d(${mix(180, 660, m)}px, ${mix(620, 555, e)}px, 0) scale(${mix(0.96, 1, e)})`;
  }

  // ---------- Player + review UI ----------
  const player = AnimPlayer.create({
    duration: DUR, size: [1080, 1350], render,
    beats: [['Enter', T.enter[0]], ['Move', T.move[0]], ['Exit', T.exit[0]]],
    keyframes: [0, T.enter[1], T.move[1], T.exit[1]],
  });
  ReviewBar.mount(player, {
    storageKey: 'motion-study-notes',
    instagram: { handle: 'yourstudio', caption: 'A small motion study.', slides: 3 },   // for the Instagram preview (I)
  });
  ReviewBar.fit(document.getElementById('stage'));   // scales the artboard into the free space (beside notes, inside the IG post)
  player.start();
})();
</script>
</body>
</html>
